<!DOCTYPE html>
<html lan="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro de usuario</title>
        <link rel="stylesheet" href="estilos.css">
    </head>

    <body>

        <h1>Registro de usuario</h1>

        <form>

            <label>Nombre:</label>
            <input type="text" id="nombre">

            <br><br>

            <label>Apellido Paterno:</label>
            <input type="text" id="paterno">

            <br><br>

            <label>Apellido Materno:</label>
            <input type="text" id="materno">

            <br><br>

            <label>Telefono:</label>
            <input type="number" id="telefono">

            <br><br>

            <label>Direccion:</label>
            <input type="text" id="direccion">

            <br><br>

            <label>Correo Electronico</label>
            <input type="email" id="correo">

            <br><br>

            <button onclick="enviar()">ENVIAR</button>

        </form>

        <p id="resultadoNombre"></p>
        <p id="resultadoApellidoPaterno"></p>
        <p id="resultadoApellidoMaterno"></p>
        <p id="resultadoTelefono"></p>
        <p id="resultadoDireccion"></p>
        <p id="resultadoCorreoElectronico"></p>

        <script src="script.js"></script>

    </body>
</html>
